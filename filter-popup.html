<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Ad filters</title>
    <script src="filter-popup.js" defer></script>
    <style>
        body { width: 20rem; padding: 0.75rem; font: 14px system-ui; }
        select { width: 100%; margin: 0.5rem 0; }
        button { margin-right: 0.25rem; }
        output { display: block; margin-top: 0.5rem; overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <p>Page elements matched by ad filters: <output id="page-ad-count" style="display: inline" aria-live="polite">Loading…</output></p>
    <p>The toolbar badge shows blocked network requests for this tab.</p>
    <p><label><input id="block-click-popups" type="checkbox" disabled> Block scripted pop-ups after clicks on this site</label></p>
    <button id="pick" type="button">Pick an ad</button>
    <p>Click an element to hide it. Press Esc to cancel.</p>
    <label for="filters">Saved filters</label>
    <select id="filters"></select>
    <button id="share" type="button" disabled>Share to community</button>
    <button id="remove" type="button" disabled>Remove</button>
    <output id="status" aria-live="polite"></output>
</body>
</html>
